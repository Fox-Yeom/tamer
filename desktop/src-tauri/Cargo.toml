[package]
name = "cvim-desktop"
version = "0.0.1"
description = "CVIM v2 desktop shell — X0 PoC"
edition = "2021"

[lib]
name = "cvim_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
base64 = "0.22"
