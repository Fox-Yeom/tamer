<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!-- 메뉴바 미니 대시보드 (STA-22, #105): our own files only (POLICY.md 11) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'" />
    <title>Tamer</title>
    <link rel="stylesheet" href="/src/popover.css" />
  </head>
  <body>
    <main id="pop">
      <!-- 위쪽 탭 (#118, rule 13): 홈 (the Pokémon and the limits) · 작업 — a few tabs at the top,
           the shop · bag · dex later in the Pokémon window (#113) -->
      <nav id="pop-nav" role="tablist"><button role="tab" data-page="home">홈<i class="pop-dot" hidden></i></button><button role="tab" data-page="work">작업</button></nav>
      <div id="pg-home" class="pop-page" role="tabpanel">
        <section id="pop-wild" class="pop-sec"></section>
        <section id="pop-lead" class="pop-sec"></section>
        <section id="pop-partner" class="pop-sec"></section>
        <section id="pop-party" class="pop-sec"></section>
        <section id="pop-limits" class="pop-sec"></section>
      </div>
      <div id="pg-work" class="pop-page" role="tabpanel">
        <section id="pop-today" class="pop-sec"></section>
        <section id="pop-prog" class="pop-sec"></section>
        <section id="pop-tabs" class="pop-sec"></section>
      </div>
      <!-- 포켓몬 창 (#121, STA-22 rule 16): its tabs from here — the shop · bag · dex live there (rule 13) -->
      <nav id="pop-poke" aria-label="포켓몬 창"><small>포켓몬 창</small><span><button data-poke="shop">상점</button><button data-poke="bag">가방</button><button data-poke="dex">도감</button></span></nav>
      <footer id="pop-foot"><button id="pop-quit" title="종료 — Tamer를 완전히 끔, 열린 터미널·에이전트도 끝나요 (⌘Q와 같음)" aria-label="종료">⏻</button><button id="pop-settings" title="설정" aria-label="설정">⚙</button><button id="pop-open" class="pop-primary">Tamer 열기</button></footer>
    </main>
    <script type="module" src="/src/popover.js"></script>
  </body>
</html>
