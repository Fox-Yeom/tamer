# cvim kitty config — included from ~/.config/kitty/kitty.conf
# Cmd shortcuts are re-sent to Neovim as CSI-u (super modifier = 9) only while
# the focused window runs cvim (bin/cvim sets user var IS_CVIM). Elsewhere kitty defaults apply.

macos_option_as_alt        yes
font_size                  14.0
enable_audio_bell          no
background                 #16161c
foreground                 #e6e6e6
cursor                     #D97757
window_padding_width       4
# native titlebar kept (drag to move window), painted like the background
hide_window_decorations    no
macos_titlebar_color       background
macos_show_window_title_in window
tab_bar_style              powerline
tab_bar_min_tabs           2
confirm_os_window_close    0

# remote control for the minimize button in cvim's top bar (socket only, no tty escape access)
allow_remote_control       socket-only
listen_on                  unix:/tmp/cvim-kitty-{kitty_pid}

# Cmd+T / Cmd+W / Cmd+R / Cmd+[ / Cmd+] / Cmd+1..9 -> <D-…> inside cvim
map --when-focus-on var:IS_CVIM cmd+t send_text all \x1b[116;9u
map --when-focus-on var:IS_CVIM cmd+w send_text all \x1b[119;9u
map --when-focus-on var:IS_CVIM cmd+r send_text all \x1b[114;9u
map --when-focus-on var:IS_CVIM cmd+e send_text all \x1b[101;9u
map --when-focus-on var:IS_CVIM cmd+[ send_text all \x1b[91;9u
map --when-focus-on var:IS_CVIM cmd+] send_text all \x1b[93;9u
map --when-focus-on var:IS_CVIM cmd+1 send_text all \x1b[49;9u
map --when-focus-on var:IS_CVIM cmd+2 send_text all \x1b[50;9u
map --when-focus-on var:IS_CVIM cmd+3 send_text all \x1b[51;9u
map --when-focus-on var:IS_CVIM cmd+4 send_text all \x1b[52;9u
map --when-focus-on var:IS_CVIM cmd+5 send_text all \x1b[53;9u
map --when-focus-on var:IS_CVIM cmd+6 send_text all \x1b[54;9u
map --when-focus-on var:IS_CVIM cmd+7 send_text all \x1b[55;9u
map --when-focus-on var:IS_CVIM cmd+8 send_text all \x1b[56;9u
map --when-focus-on var:IS_CVIM cmd+9 send_text all \x1b[57;9u

# outside cvim: Cmd+Shift+T opens a new kitty tab already running cvim
map cmd+shift+t launch --type=tab --cwd=current cvim
